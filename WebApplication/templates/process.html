<!-- submission_type, placeholder_url - obtained from flask/APIFramework-->
{% extends "base.html" %}

{% block head %}
<style>
  #fileType label.btn {
      flex: 1 1 0; /* Force equal growth */
      cursor: pointer;
      margin-right: 0;              
      white-space: nowrap;
  }

  #inputform {
    width: 70%;
    margin: 0 auto;
  }
  
  .upload-card {
      border: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      /* min-height: 60vh;  */
  }
  
  .upload-area {
      border: 2px dashed #dee2e6;
      border-top: none;  
      border-radius: 0 0 10px 10px; 
      padding: 20px 20px;
      text-align: center;
      transition: all 0.3s ease;
      background: #f8f9fa;
      /* margin: 20px auto;  */
      /* max-width: 500px;  */

      /* width: 70%; # */
  }

  .upload-area {
    width: 100%;
    max-width: 100%;
    /* box-sizing: border-box; */
}

    /* Keep images and controls responsive */
    .upload-area img {
        max-width: 100%;
        height: 35px;
    }
  
    .upload-area:hover {
        border-color: #007bff;
        background-color: #e3f2fd;
    }
  
  .upload-area.dragover {
      border-color: #007bff;
      background-color: #e3f2fd;
      transform: scale(1.02);
  }
  
  .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: auto; 
      margin: 0 auto; 
  }
  
  .file-input-wrapper input[type=file] {
      position: absolute;
      left: -9999px;
  }
  
  .file-input-label {
      display: inline-block;
      padding: 8px 20px; 
      background: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: auto; 
      text-align: center;
      font-size: 14px; 
  }
  
  .file-input-label:hover {
      background: #0056b3;
      transform: translateY(-2px);
  }

  
  .form-control {
      border-radius: 6px;
      border: 1px solid #ced4da;
      padding: 12px 16px;
      transition: all 0.3s ease;
  }
  
  .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
  }
  
  .btn-secondary {
      border: none;
      padding: 8px 24px; 
      font-size: 14px; 
      font-weight: 600;
      border-radius: 6px;
      transition: all 0.3s ease;
      width: auto; 
      margin: 20px auto 0; 
      display: block; 
  }
  
  .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
  }
  
  .file-info {
      background: #e9ecef;
      border-radius: 6px;
      padding: 10px;
      margin: 10px auto 0; /* Center horizontally */
      display: none;
      /* max-width: 500px;     # */
  }
  
  .file-info.show {
      display: block;
  }
  
  .method-tabs {
      display: flex;
      flex-wrap: wrap;
      max-width: 100%;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
  }

  .method-tabs .btn {
       margin-bottom: 0;       
       border-radius: 6px 6px 0px 0px;  
   }

  
</style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const submission_type = "{{ submission_type }}".trim();

        const fileTypeContainer = document.getElementById('fileType');
        let labels = document.querySelectorAll('#fileType label'); 

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('file');
        const fileInfo = document.getElementById('fileInfo');

        const fields = {
            file: document.getElementById('fileUploadField'),
            url: document.getElementById('urlInputField'),
            pmid: document.getElementById('pmidInputField'),
        };

        function hideAllFields() {
            Object.values(fields).forEach(el => { if (el) el.style.display = 'none'; });
        }

        function showField(value) {
            hideAllFields();
            if (value === 'pmid' && submission_type !== 'Manuscript') return;
            const el = fields[value];
            if (el) el.style.display = 'flex';
        }

        function setActiveLabelFor(value) {
            // always operate on fresh labels after any DOM changes
            labels = document.querySelectorAll('#fileType label');
            labels.forEach(l => l.classList.remove('active'));
            const target = [...labels].find(l => {
                const input = l.querySelector('input[name="fileType"]');
                return input && input.value === value;
            });
            if (target) target.classList.add('active');
        }

        function updateFileInfo(file) {
            const fileInfo = document.getElementById('fileInfo');
            if (fileInfo) {
                fileInfo.innerHTML = `
                    <strong>Selected file:</strong> ${file.name}<br>
                `;
                fileInfo.classList.add('show');
            }
        }

        // Remove PMID option if not a Manuscript, then refresh labels
        if (submission_type !== 'Manuscript') {
            document
                .querySelectorAll('label input[name="fileType"][value="pmid"]')
                .forEach(input => input.closest('label')?.remove());        // ? is used so that if input label doesnt match anythng it will return null/undefined rather than throwing an error
            labels = document.querySelectorAll('#fileType label'); // refresh after removal
        }

        // Event delegation
        if (fileTypeContainer) {
            fileTypeContainer.addEventListener('click', (e) => {
                const label = e.target.closest('label');
                if (!label || !fileTypeContainer.contains(label)) return;
                const input = label.querySelector('input[name="fileType"]');
                if (!input) return;

                input.checked = true;
                setActiveLabelFor(input.value);
                showField(input.value);
            });
        }
        
        // Initialize AFTER any removals
        // if submission_type - is Manuscript --> PMID tab should be the primary tab
        // else File uplaod should be the primary tab
        if (submission_type === 'Manuscript') {
            const pmidInput = document.querySelector('input[value="pmid"]');
            if (pmidInput) {
                pmidInput.checked = true;
                setActiveLabelFor('pmid');
                showField('pmid');
            }
        } else {
            // Default to file upload for non-Manuscript submissions
            const fileInput = document.querySelector('input[value="file"]');
            if (fileInput) {
                fileInput.checked = true;
                setActiveLabelFor('file');
                showField('file');

            }
        } 


        // Drag and drop functionality
        if (uploadArea) {
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    updateFileInfo(files[0]);
                }
            });

            // uploadArea.addEventListener('click', () => {
            //     fileInput.click();
            // });
        }

        // File input change handler
        if (fileInput) {
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    updateFileInfo(e.target.files[0]);
                }
            });
        }
    });

    function setLoadingState(isLoading) {
        const btn = document.querySelector('button[type="submit"]');
        const uploadArea = document.querySelector('.upload-area');
        if (isLoading) {
            btn.disabled = true;
            btn.textContent = 'Processing...';
            uploadArea.style.backgroundColor = '#b3b5b7';
        } else {
            // Remove inline styles to revert to original CSS
            btn.disabled = false;
            btn.textContent = 'Submit';
            uploadArea.style.backgroundColor = '';;
        }

        btn.style.backgroundColor = '#6c757d';
        btn.style.color = 'white'
    }

    function validateForm(event) {
        event.preventDefault(); 

        let submission_type = "{{ submission_type }}".trim();
        let pmcid = '';
        
        let placeholder_url = "{{ placeholder_url }}".trim();
        const uploadOption = document.querySelector('input[name="fileType"]:checked').value;
        
        const allowedFormats = {
            'Manuscript': ['pdf'],
            'Multi-Glycan Image': ['png', 'jpg', 'jpeg'],
            'Simple Glycan Image': ['png', 'jpg', 'jpeg']
        };
        
        if (uploadOption === 'file') {
            const fileInput = document.getElementById('file');
            if (!fileInput.files.length) { alert('Please upload a file.'); return false; }
            const ext = fileInput.files[0].name.split('.').pop().toLowerCase();
            if (!allowedFormats[submission_type].includes(ext)) {
                alert(`Invalid file format. Allowed: ${allowedFormats[submission_type].join(', ')}`); 
                return false;
            }
        } else if (uploadOption === 'url') {
            const urlInput = document.getElementById('fileURL').value.trim();
            if (!urlInput) { alert('Please enter a URL.'); return false; }
            const ext = urlInput.split('?')[0].split('.').pop().toLowerCase();
            if (!allowedFormats[submission_type].includes(ext)) {
                alert(`Invalid URL format. Allowed: ${allowedFormats[submission_type].join(', ')}`); 
                return false;
            }
        } else if (uploadOption === 'pmid') {
            const pmid = document.getElementById('pmid').value.trim();

            if (!pmid) { 
                alert('Please enter a PMID.'); 
                return false; 
            }

            // Change sumbit button style to indicate that the request is being processed - UI visual changes
            setLoadingState(true);

            // Validate if PMID has Open Access resources for PMCID via backend API using AJAX
            jQuery.ajax({
                type: 'POST',
                url: '{{urlprefix}}/pmid',
                contentType: 'application/json',
                data: JSON.stringify({ pmid: pmid }),
                success: function(result) {
                    if (!result.valid) {
                        alert(result.error || 'Invalid PMID. Please check and try again.');
                        return false;
                    }
                                        
                    // Proceed with form submission after PMID validation
                    submitForm(submission_type, pmid);
                },
                error: function(xhr, status, error) {
                    // console.log('AJAX error:', status, error);
                    
                    // Extract error message from Flask response
                    let errorMessage = 'Failed to validate PMID';
                    
                    try {
                        if (xhr.responseJSON && xhr.responseJSON.error) {
                            errorMessage = xhr.responseJSON.error;
                        } else if (xhr.responseText) {
                            const responseData = JSON.parse(xhr.responseText);
                            errorMessage = responseData.error || responseData.message;
                        }
                    } catch (parseError) {
                        console.error('Error parsing response:', parseError);
                        errorMessage = `Failed to validate PMID: ${error}`;
                    }

                    setLoadingState(false);
                    alert(errorMessage);
                }
            });
            
            return false; // Don't proceed until PMID validation completes
        }
        
        // Change sumbit button style to indicate that the request is being processed - UI visual changes
        setLoadingState(true);

        // proceeds directly for non-PMID uploads without the PMID validation check
        submitForm(submission_type, null);
        return false;
    }

    function submitForm(submission_type, pmid) {
        const formData = new FormData(); // Create empty FormData
        formData.append('submission_type', submission_type);

        // Get the selected upload method
        const uploadOption = document.querySelector('input[name="fileType"]:checked').value;
    
        // Add the appropriate field based on upload method
        if (uploadOption === 'file') {
            const fileInput = document.getElementById('file');
            formData.append('file', fileInput.files[0]);
        } else if (uploadOption === 'url') {
            const urlInput = document.getElementById('fileURL');
            formData.append('fileURL', urlInput.value.trim());
        } else if (pmid) {
            formData.append('pmid', pmid);
        }
        
        // POST form details using AJAX
        jQuery.ajax({
            type: 'POST',
            url: '{{urlprefix}}/file_upload',
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                if (response) {
                    window.location = '{{urlprefix}}/jobs';
                }
            },
            error: function(xhr, status, error) { 
                // console.log('AJAX err:', status, error);
                
                // Extract error message from Flask response
                let errorMessage = "Upload failed: Either url is under a paywall or url format is not supported";
                
                try {
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMessage = xhr.responseJSON.error;
                    } else if (xhr.responseText) {
                        const responseData = JSON.parse(xhr.responseText);
                        errorMessage = responseData.error || responseData.message;
                    }
                } catch (parseError) {
                    console.error('Error parsing response:', parseError);
                }
                alert(errorMessage);
            }
        });
    }
        
</script>

{% endblock %}


{% block content %}
<div class="container-fluid d-flex flex-column">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-white">
            <li class="breadcrumb-item"><a href="{{urlprefix}}/">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{submission_type}}</li>
        </ol>
    </nav>

    <div class="upload-container">
        <div class="card upload-card">
            <div class="card-body">
                <form id="inputform" onsubmit="return validateForm(event)">
                    <!-- Upload Method Selection -->
                    <div id="fileType" class="method-tabs d-flex w-100" data-toggle="buttons">
                        <label class="btn btn-outline-secondary flex-fill text-center">
                            <input type="radio" name="fileType" value="pmid" autocomplete="off"> 
                            <!-- <i class="fas fa-link mr-2"></i> -->
                            PubMed ID
                        </label>

                        <label class="btn btn-outline-secondary flex-fill text-center">
                          <input type="radio" name="fileType" value="file" autocomplete="off"> 
                          <!-- <i class="fas fa-upload mr-2"></i> -->
                          Upload File
                        </label>
                        <label class="btn btn-outline-secondary flex-fill text-center">
                          <input type="radio" name="fileType" value="url" autocomplete="off"> 
                          <!-- <i class="fas fa-link mr-2"></i> -->
                          Paste URL
                        </label>

                        <!-- <label class="btn btn-outline-secondary flex-fill text-center">
                          <input type="radio" name="fileType" value="photo" autocomplete="off"> 
                          <i class="fas fa-camera mr-2"></i>Take Photo
                        </label> -->
                    </div>


                    <!-- INPUT FIELDS -->

                    <!-- PMID Input Field -->
                    <div id="pmidInputField" style="display: none;">
                        <div class="upload-area">
                            <div class="form-group">
                                <!-- <label for="fileURL" class="form-label">Document URL</label> -->
                                <!-- <i class="fas fa-link fa-3x text-muted mb-3"></i> -->
                                <img src="{{urlprefix}}/static/images/pdf.svg">
                                <h5>PubMed ID (Open-Access, PMC manuscripts only)</h5>
                                <input type="text" name="pmid" id="pmid" class="form-control" 
                                        placeholder=31614918 />
                            </div>
                        </div>
            
                    </div>

                    <!-- File Upload Field -->
                    <div id="fileUploadField">
                        <div class="upload-area" id="uploadArea">
                            <!-- <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i> -->
                            <img src="{{urlprefix}}/static/images/upload.svg">
                            <h5>Drag & Drop your file here</h5>
                            <p class="text-muted">or</p>
                            <div class="file-input-wrapper">
                                <label for="file" class="file-input-label">
                                    <!-- <i class="fas fa-folder-open mr-2"></i> -->
                                    <img src="{{urlprefix}}/static/images/folder.svg">
                                    Browse Files
                                </label>
                                <input type="file" name="file" id="file"/>
                            </div>

                            <div id="fileInfo" class="file-info"></div>
                        </div>
                    </div>

                    <!-- URL Input Field -->
                    <div id="urlInputField" style="display: none;">
                      <div class="upload-area">
                        <div class="form-group">
                          <!-- <label for="fileURL" class="form-label">Document URL</label> -->
                          <!-- <i class="fas fa-link fa-3x text-muted mb-3"></i> -->
                          <img src="{{urlprefix}}/static/images/link.svg">
                          <h5>URL</h5>
                          <input type="url" name="fileURL" id="fileURL" class="form-control" 
                                placeholder={{placeholder_url}} />
                        </div>
                      </div>
            
                    </div>


                    <!-- Photo Field -->
                    <!-- <div id="photoField" style="display: none;">
                        <div class="form-group">
                            <label for="photoInput" class="form-label">Take Photo</label>
                            <input type="file" name="photo" id="photoInput" class="form-control" 
                                   accept="image/*" capture="camera" />
                        </div>
                    </div> -->

                    <button type="submit" class="btn btn-secondary">
                        <!-- <i class="fas fa-paper-plane mr-2"></i> -->
                        Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
