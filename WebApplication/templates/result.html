{% extends "base.html" %}
{% block head %}
<script>
    "use strict";
    let list_id = null;

    let start_time_stamp = null;
    let wait_cycle = ["Please wait", "Please wait.", "Please wait..", "Please wait..."];
    let wait_cycle_index = 0;
    let calculation_time = 0.0;
    let delay = 5;

    function query() {
        let request_URL = "{{urlprefix}}/retrieve?list_ids=" + JSON.stringify([list_id]);
        jQuery.getJSON(request_URL, function (d) {
            let tmp = d[0];

            // in ms
            let time_lapsed = new Date().getTime() - start_time_stamp;

            if (tmp.finished) {
                calculation_time = Math.floor(tmp.result["runtime"]);
                // console.log("runtime")
                // console.log(tmp.result["runtime"])
                if (window.document.location.toString().includes("file_upload")) {
                    window.document.location = "{{urlprefix}}/result/"+list_id;
                } else {
                    addDownloadButton(tmp);
                }
            }
            else {
                result.innerHTML = "<h3>Your file has been successfully uploaded for analysis.</h3><h3 id=\"info\">Please wait</h3>"
                
                wait_cycle_index += 1;
                wait_cycle_index = wait_cycle_index % 4;

                let additional_message = "";
                // if (time_lapsed > 20*1000){
                //    // Takes more than 10 seconds after submission
                //    additional_message = "It might take longer for large file. "
                // }

                let info = document.getElementById("info");
                info.innerText = additional_message + wait_cycle[wait_cycle_index];

                setTimeout(query, delay * 1000)
            }
        })
    }

    function toggleIUPAC(id, textId) {
        const el = document.getElementById(id);
        const textEl = document.getElementById(textId);

        if (el.style.display === "none") {
            el.style.display = "block";

            // Automatically copy content
            const text = textEl.innerText;
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed"; // prevent scroll jump
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);

            // Show confirmation message
            const confirmation = document.createElement("div");
            confirmation.innerText = "✓ Copied to clipboard!";
            confirmation.style.color = "green";
            confirmation.style.fontSize = "12px";
            confirmation.style.marginTop = "5px";
            confirmation.style.textAlign = "center";
            el.appendChild(confirmation);

            // Remove message after 2 seconds
            setTimeout(() => {
                if (confirmation && confirmation.parentNode) {
                    confirmation.parentNode.removeChild(confirmation);
                }
            }, 2000);
        } else {
            el.style.display = "none";
        }
    }

    function addDownloadButton(result) {
        let alert_data = document.getElementById("alert_data");
        let reselt = document.getElementById("result");
        let div = document.getElementById("list_id");
        div.style.backgroundColor = "#FFFFFF";

        let location = result['location'] || "files";
        var figures = result['result']['figure_result'];
        var file_extension = result['submission_detail']['original_file_name'].split('.').pop();

        var alert_str = ""
        var resstr = ""


        alert_data.innerHTML = alert_str

        // resstr += "<h3>Analysis complete. ("+calculation_time+" sec)<h3>\n<ul>";
        resstr += "<h3 style='font-size:1.3rem;margin-top:0rem;'>Results: ";
        // if (result.result.inputtype == "pdf") {
        //     resstr += "<A target=\"_blank\" href=\"file_download?list_id="+list_id+"\">Annotated PDF</A>, "
        //     }
        resstr += "<span> <a style='background-color:#e8e3e3; font-weight:400; border-radius:20px; padding:1px 5px 1px 5px;' href=\"{{urlprefix}}/static/" + location + "/" + list_id + "/results.json" + "\" target=\"_blank\">JSON data</a> | </span> ";
        if (file_extension == "pdf") {
            // console.log("PDF",result.submission_detail)
            resstr += "<span><a style='background-color:#e8e3e3; font-weight:400; border-radius:20px;padding:1px 5px 1px 5px;' target=\"_blank\" href=\"{{urlprefix}}/static/" + location + "/" + list_id + "/input/" + encodeURIComponent(result.submission_detail.original_file_name) + "\">Original PDF</a>"
        } else {
            // console.log("result",result)
            resstr += "<span><a style='background-color:#e8e3e3; font-weight:400; border-radius:20px;padding:1px 5px 1px 5px;' target=\"_blank\" href=\"{{urlprefix}}/static/" + location + "/" + list_id + "/input/" + encodeURIComponent(result.submission_detail.original_file_name) + "\">Original Image</a></span>"
        }
        // resstr += "<a style='background-color:#e8e3e3; font-weight:400; border-radius:20px;padding:1px 5px 1px 5px;' href=\"" + "{{urlprefix}}/result/" + list_id + "\">Bookmark</a></h3>";
        reselt.innerHTML = resstr;

        document.getElementById("extracted").style = "display: block;";


        var innerdiv = "<table style='border-collapse: collapse; text-align: center; background-color: #FFFFFF;'>";
        innerdiv += "<tbody>"

        figures.forEach(function (figure, fig_id) {
            var figure_image = figure['annotated_image_path']
            var figure_width = figure['width']
            var figure_height = figure['height']
            
            // 550: because max-width is set to 550px for each figure below
            var scale = 1;
            if (figure_width > 550) {
            scale = 550 / figure_width;
            }
            // console.log("Figure", figure, "at index", fig_id);

            // code to add the page_num, annotated figure
            innerdiv += "<tr style='background-color:#7c7d7d;'>";
            innerdiv += `<th colspan='3' style='color:#ffffff'; text-align: center;'> </th>`;
            innerdiv += "</tr>";

            innerdiv += `<tr>
            <td colspan='3' style='padding: 20px; text-align: center;'>
                <div id="figure-${fig_id}" style="position: relative; display: inline-block; max-width: 550px;">
                    <img 
                        style="max-width: 550px; width: auto; height: auto; display: block;" 
                        src='{{urlprefix}}/static/${location}/${list_id}/${figure.annotated_image_path}' />
            `;
            
            // using CSS based image overlay to display index values on the image
            // instead of HTML image map, because CSS based overlays are easier to style and control and its easier to add custom styling like tooltips, hover, etc
            var glycans = figure['glycans'] || []
            glycans.forEach(function (glycan, gly_idx) {
                var [x, y, w, h] = glycan['bbox'];

                // Apply same scale as image
                var sx = x * scale;
                var sy = y * scale;
                var sw = w * scale;
                var sh = h * scale;

                innerdiv += `
                    <a href="#glycan-${fig_id}-${gly_idx+1}" 
                    onclick="scrollAndHighlight('glycan-${fig_id}-${gly_idx + 1}', event)"
                    style="position: absolute;
                            left: ${sx}px;
                            top: ${sy}px;
                            width: ${sw}px;
                            height: ${sh}px;
                            pointer-events: auto;
                            cursor: pointer;
                            box-sizing: border-box;
                            text-decoration: none;
                    ">

                        <div style="
                            position: absolute;
                            top: 0;
                            left: 0;
                            background: rgba(255, 0, 0, 0.8);
                            color: white;
                            font-size: 8px;
                            padding: 1px 2px;
                            border-bottom-right-radius: 4px;">
                            ${gly_idx+1}
                        </div>
                    
                    </a>`;
                });

                innerdiv += `</div></td></tr>`;

                // var glycans = figure['glycans'] || []

                if (glycans.length > 0) {
                    innerdiv += "<tr style='background-color: #7c7d7d;'>";
                    innerdiv += "<th style='color: #ffffff;text-align: center;'>#</th>";
                    innerdiv += "<th style='color: #ffffff;text-align: center;'>Glyan Image</th>";
                    innerdiv += "<th style='color: #ffffff; text-align: center;'>Extracted Structure</th>";
                    innerdiv += "</tr>";


                    glycans.forEach(function (glycan, gly_idx) {
                        

                        innerdiv += `<tr id=glycan-${fig_id}-${gly_idx+1}>`;
                        innerdiv += `
                            <td>
                                <div style="font-weight:bold; background: rgba(255, 0, 0, 0.8);
                                color: white;padding: 1px 2px; border-bottom-right-radius: 4px;">
                                ${gly_idx+1}
                                </div>
                            </td>
                            <td style="vertical-align:middle;" width="50%">
                                <div style="position: relative; display: inline-block; max-width: 550px;">
                                    <img style="max-width: 300px; min-width: 90px; display: block; margin: auto;" 
                                        src="{{urlprefix}}/static/${location}/${list_id}/${glycan.extracted_image_path}" 
                                        alt="Glycan Image" />
                            </td>`;

                        innerdiv += `<td style='text-align: center;' width="50%">`
                            if (glycan.glyImage) {
                                innerdiv += `
                                    <figure style='margin: 0;'>
                                    <img style='max-width: 300px; min-width: 90px; width: auto; height: auto; display: block; margin: auto;' 
                                        src="${glycan.glyImage}"
                                        alt='Glycan Image' />
                                    </figure>
                                `
                            } else {
                                innerdiv += `<div style="font-size: 16px; color: #555; margin-top: 10px;">Couldn't extract structure</div>`
                            }

                            innerdiv += `<figcaption style="font-size: 14px; color: #555; margin-top: 5px; display: flex; align-items: center; justify-content: center;">`
                                if (glycan.accession) {
                                    innerdiv += `GlyTouCan: ${glycan.accession}`
                                } 

                                if (glycan.errors.length > 0 ) {
                                    innerdiv += `
                                        <span style="margin-left: 10px; background: #eb7676; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; cursor: pointer; position: relative; 
                                            transition: box-shadow 0.3s ease; box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);"
                                            onmouseover="errorMessage(this)" 
                                            onmouseout="errorMessage(this)">
                                            ⚠️
                                            <span class="tooltip" style="visibility: hidden; width: 180px; background-color: #373b3b;; color: white; text-align: left; border-radius: 5px; padding: 8px;
                                                                        position: absolute; z-index: 1; bottom: 125%; left: 50%; transform: translateX(-50%);
                                                                        opacity: 0; transition: opacity 0.3s;">
                                                ${glycan.errors.map(e => `<div>• ${e} </div>`).join('')}
                                            </span>
                                        </span>`
                                }

                            innerdiv += `</figcaption>`

                            innerdiv += `<div style="margin-top: 20px; text-align: center;">`
                                if (glycan.IUPAC && glycan.IUPAC.length > 0) {
                                    innerdiv += `
                                        <div style="display: inline-block; margin: 10px;">
                                            <button onclick="toggleIUPAC('iupac-${fig_id}-${gly_idx}', 'iupac-text-${fig_id}-${gly_idx}')" 
                                                    style="background-color:#7c7d7d; color:white; border:none; border-radius:5px; cursor:pointer;">
                                                IUPAC&nbsp;<b>&#128464;</b>
                                            </button>

                                        </div>
                                    `
                                }

                                if (glycan.WURCS && glycan.WURCS.length > 0) {
                                    innerdiv += `
                                        <div style="display: inline-block; margin: 10px;">
                                            <button onclick="toggleIUPAC('wurcs-${fig_id}-${gly_idx}', 'wurcs-text-${fig_id}-${gly_idx}')" 
                                                    style="background-color:#7c7d7d; color:white; border:none; border-radius:5px; cursor:pointer;">
                                                WURCS&nbsp;<b>&#128464;</b>
                                            </button>
                                        </div>
                                    `
                                }

                                if (glycan.composition_str && glycan.composition_str.length > 0) {
                                    innerdiv += `
                                        <div style="display: inline-block; margin: 10px;">
                                            <button onclick="toggleIUPAC('composition-${fig_id}-${gly_idx}', 'composition-text-${fig_id}-${gly_idx}')" 
                                                    style="background-color:#7c7d7d; color:white; border:none; border-radius:5px; cursor:pointer;">
                                                Composition&nbsp;<b>&#128464;</b>
                                            </button>
                                        </div>
                                    `
                                }

                                if (glycan.gnomeurl && glycan.gnomeurl.length > 0) {
                                    innerdiv += `
                                        <div style="display: inline-block; margin: 10px;">
                                            <A href="${glycan.gnomeurl}" target="_gnome_"
                                                    style="background-color:#7c7d7d; color:white; border:none; border-radius:5px; cursor:pointer; appearance: button; text-decoration: none; font-weight: 300; padding: 1px 4px 1px 4px;">GNOme&nbsp;<b>&#10138;</b></A>
                                        </div>
                                    `
                                }
                            innerdiv += `</div>`

                            innerdiv += `
                                <div>
                                        <div id="iupac-${fig_id}-${gly_idx}" style="display: none; max-width: 300px; overflow-x: auto; margin: 10px auto 0; padding: 10px; border: 1px solid #ccc; background: #f8f8f8; font-family: monospace; white-space: nowrap;">
                                            <div id="iupac-text-${fig_id}-${gly_idx}">
                                                ${glycan.IUPAC}
                                            </div>
                                        </div>
                                        <div id="wurcs-${fig_id}-${gly_idx}" style="display: none; max-width: 300px; overflow-x: auto; margin: 10px auto 0; padding: 10px; border: 1px solid #ccc; background: #f8f8f8; font-family: monospace; white-space: nowrap;">
                                            <div id="wurcs-text-${fig_id}-${gly_idx}">
                                                ${glycan.WURCS}
                                            </div>
                                        </div>
                                        <div id="composition-${fig_id}-${gly_idx}" style="display: none; max-width: 300px; overflow-x: auto; margin: 10px auto 0; padding: 10px; border: 1px solid #ccc; background: #f8f8f8; font-family: monospace; white-space: nowrap;">
                                            <div id="composition-text-${fig_id}-${gly_idx}">
                                                ${glycan.composition_str}
                                            </div>
                                        </div>
                                </div>
                            `  
                        innerdiv += `</td>`
                        innerdiv += `</tr>`
                    })
                };
        });

        innerdiv += "</tbody>"
        innerdiv += "</table>";
        div.innerHTML = innerdiv;

    }

    function scrollAndHighlight(rowId, event) {
        if (event) event.preventDefault();  // Prevent default jump

        const el = document.getElementById(rowId);
        if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            el.style.backgroundColor = "#f4f1e5";
            setTimeout(() => {
                el.style.backgroundColor = "";
            }, 1500);

            // Manually set the hash without jumping
            history.pushState(null, null, `#${rowId}`);
        }
    }

    // Function to toggle the visibility of file input fields based on the selected radio button
    function errorMessage(element) {
        const tooltip = element.querySelector('.tooltip');

        if (event.type === 'mouseover') {
            tooltip.style.visibility = 'visible';
            tooltip.style.opacity = '1';
        } else if (event.type === 'mouseout') {
            tooltip.style.visibility = 'hidden';
            tooltip.style.opacity = '0';
        }
    }

</script>
{% endblock %}

{% block onload %}
<script>
    function onload() {
        list_id = document.getElementById("list_id").getAttribute("data-list_id");
        start_time_stamp = new Date().getTime();
        query();
    }
</script>
{% endblock %}

{% block content %}
<div id="alert_data">
</div>

<div style="width:90%;margin:0 auto;" id="result">
</div>
<div id="extracted" style="display: none"></div>
<div style="display: flex; flex-wrap: wrap; width:90%;margin:0 auto;" id="list_id" data-list_id="{{list_id}}"></div>
{% endblock %}
