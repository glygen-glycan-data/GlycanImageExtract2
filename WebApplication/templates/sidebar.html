
<style>
    /* Sidebar Styles */
    .sidebar {
        position: fixed;
        top: 0;
        left: -300px;
        width: 300px;
        height: 100vh;
        background-color: #343a40;
        color: white;
        transition: left 0.3s ease;
        z-index: 1050;
        overflow-y: auto;
        box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }

    .sidebar.show {
        left: 0;
    }

    .sidebar-header {
        padding: 1rem;
        border-bottom: 1px solid #495057;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #2c3e50;
    }

    .sidebar-title {
        margin: 0;
        color: white;
        font-weight: 600;
    }

    .sidebar-close {
        color: white;
        font-size: 1.5rem;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        margin-left: auto;
    }

    .sidebar-close:hover {
        color: #adb5bd;
    }

    .sidebar-body {
        padding: 1rem 0;
    }

    .sidebar .nav-link {
        color: #adb5bd;
        padding: 0.75rem 1.5rem;
        border: none;
        transition: all 0.3s ease;
        text-decoration: none;
        display: block;
    }

    .sidebar .nav-link:hover {
        color: white;
        background-color: #495057;
        text-decoration: none;
    }

    .sidebar .nav-link.active {
        color: white;
        background-color: #007bff;
    }

    .sidebar .nav-link i {
        margin-right: 0.5rem;
        width: 20px;
        text-align: center;
    }

    .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1040;
        display: none;
    }

    .sidebar-overlay.show {
        display: block;
    }

    /* Adjust main content when sidebar is open */
    body.sidebar-open #main-content {
        margin-left: 300px;
        transition: margin-left 0.3s ease;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
        .sidebar {
            width: 280px;
            left: -280px;
        }
        
        body.sidebar-open #main-content {
            margin-left: 0;
        }
    }

    /* Hamburger button styles */
    #sidebarToggle {
        font-size: 1.5rem;
        padding: 0.5rem;
        margin-right: 1rem;
        z-index: 1060;
        border: none;
        background: none;
        color: white;
        cursor: pointer;
    }

    #sidebarToggle:hover {
        color: #adb5bd;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
    console.log("Sidebar module loaded");
    
    // Get elements
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarClose = document.getElementById('sidebarClose');
    const body = document.body;

    // Check if elements exist
    // if (!sidebarToggle) {
    //     console.error("Sidebar toggle button not found!");
    //     return;
    // }

    // if (!sidebar) {
    //     console.error("Sidebar not found!");
    //     return;
    // }

    // Sidebar functions
    function openSidebar() {
        console.log("Opening sidebar");
        sidebar.classList.add('show');
        if (sidebarOverlay) {
            sidebarOverlay.classList.add('show');
        }
        body.classList.add('sidebar-open');
    }

    function closeSidebar() {
        console.log("Closing sidebar");
        sidebar.classList.remove('show');
        if (sidebarOverlay) {
            sidebarOverlay.classList.remove('show');
        }
        body.classList.remove('sidebar-open');
    }

    // Event listeners
    sidebarToggle.addEventListener('click', function(e) {
        e.preventDefault();
        // console.log("Hamburger clicked!");
        openSidebar();
    });

    if (sidebarClose) {
        sidebarClose.addEventListener('click', function(e) {
            e.preventDefault();
            closeSidebar();
        });
    }

    if (sidebarOverlay) {
        sidebarOverlay.addEventListener('click', function(e) {
            e.preventDefault();
            closeSidebar();
        });
    }

    // Close sidebar on window resize
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
            closeSidebar();
        }
    });

    // Close sidebar when clicking on sidebar links
    document.querySelectorAll('.sidebar .nav-link').forEach(link => {
        link.addEventListener('click', function(e) {
            // Don't prevent default for navigation links
            closeSidebar();
        });
    });

    // Set active navigation item based on current page
    setActiveNavItem();

    console.log("Sidebar functionality initialized successfully");
});

    // Function to set active navigation item
    function setActiveNavItem() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.sidebar .nav-link');
        
        navLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
            }
        });
    }
</script>

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <button class="btn btn-link sidebar-close" id="sidebarClose">
            <span>&times;</span>
        </button>
    </div>
    <div class="sidebar-body">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="{{urlprefix}}/">
                    <!-- <i class="fas fa-home"></i>  -->
                    Home
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{urlprefix}}/jobs">
                    <!-- <i class="fas fa-tasks"></i>  -->
                    Results
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{urlprefix}}/examples">
                    <!-- <i class="fa-solid fa-check"></i> Examples -->
                    <!-- <img src="{{urlprefix}}/static/images/examples.svg" alt="Examples" class="sidebar-icon"> Examples -->
                    Examples
                </a>
            </li>
            <!-- <li class="nav-item">
                <a class="nav-link" href="#" onclick="alert('About coming soon!')">
                    <i class="fas fa-cog"></i> About
                </a>
            </li> -->
        </ul>
    </div>
</div>

<div id="sidebarOverlay" class="sidebar-overlay"></div>
