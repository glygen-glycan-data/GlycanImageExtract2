config=linkage/yolov3_linkage_v2_20k.cfg
weights=linkage/yolov3_linkage_v2_20k.weights
expandimage=0
boxpadding=3
iou_threshold=0.5
conf_threshold=0.75

[Finder:ConnectYOLOLinkage_v2_20k_topology] 
