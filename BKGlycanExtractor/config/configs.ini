[Pipeline:GlycanCompare-YOLOFinders]
figure_steps = SingleGlycanImage 
glycan_steps = YOLOMonosRandom,YOLORootFinder,ConnectYOLOBig,YOLOGlycan

[Pipeline:GlycanCompare-YOLO58Finders]
figure_steps = SingleGlycanImage 
glycan_steps = YOLOMono_58,YOLORedEnd_58,YOLOLink_58,YOLOGlycan

[Pipeline:GlycanCompare-YOLOFindersBiased]
figure_steps = SingleGlycanImage 
glycan_steps = YOLOMonosBiased_V1,YOLORootFinder,ConnectYOLOBig,YOLOGlycan

[Pipeline:GlycanCompare-KnownFinders]
figure_steps = SingleGlycanImage
glycan_steps = KnownMono,KnownRoot,KnownLink,KnownGlycan

# Pipeline for WebApplication
[Pipeline:SingleGlycanImage-YOLOFinders]
figure_steps = SingleGlycanImage
glycan_steps = YOLOMono_58,YOLORedEnd_58,YOLOLink_58

# Pipeline for WebApplication
[Pipeline:MultipleGlycanImage-YOLOFinders]
figure_steps = OriginalYOLO,CleanImage 
glycan_steps = YOLOMono_58,YOLORedEnd_58,YOLOLink_58

[Pipeline:SingleGlycanImage-YOLOFinders_linkage_1000]
figure_steps = SingleGlycanImage 
glycan_steps = YOLOMonosRandom,YOLORootFinder,ConnectYOLOLinkage_1000

[Pipeline:SingleGlycanImage-YOLOFinders_linkage_5000]
figure_steps = SingleGlycanImage 
glycan_steps = YOLOMonosRandom,YOLORootFinder,ConnectYOLOLinkage_5000,YOLOGlycan

[Pipeline:KnownSemantics]
figure_steps = SingleGlycanImage
glycan_steps = KnownMono,KnownRoot,KnownLink,KnownGlycan

[Pipeline:KnownSemanticsWithInfo]
figure_steps = SingleGlycanImage
glycan_steps = KnownMono,KnownRoot,KnownLinkWithInfo,KnownGlycan

[Pipeline:OriginalAnnotator]
figure_steps = SingleGlycanImage
glycan_steps = HeuristicMonos, OriginalConnector, DefaultOrientationRootFinder

[Pipeline:YOLOOrientationAnnotator]
figure_steps = SingleGlycanImage
glycan_steps = HeuristicMonos, OriginalConnector, YOLOOrientationRootFinder

[Pipeline:YOLORootFinderAnnotator]
figure_steps = SingleGlycanImage
glycan_steps = HeuristicMonos, OriginalConnector, YOLORootFinder

[Pipeline:YOLOMonosPlusOrientationAnnotator]
figure_steps = SingleGlycanImage
glycan_steps = YOLOMonosRandom, OriginalConnector, YOLOOrientationRootFinder

[Pipeline:YOLOMonosPlusRootFinderAnnotator]
figure_steps = SingleGlycanImage
glycan_steps = YOLOMonosRandom, OriginalConnector, YOLORootFinder

